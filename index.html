<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- 固定视口宽度：取消移动端适配，手机按桌面版布局渲染后整体缩放显示 -->
    <meta name="viewport" content="width=1280">
    <meta name="theme-color" content="#fdfaf3">
    <meta name="description" content="MonoHub —— 图文、视频、Markdown 与社区交流">
    <link rel="icon" type="image/png" href="@/public/favicon.png">
    <!-- <link rel="icon" href="/favicon.ico"> -->
    <title>MonoHub</title>
    <!-- 主题预置：首次绘制前就把已保存的主题写到 <html>，否则刷新时会先以默认亮色渲染一帧再切回。
         键名与取值需与 src/stores/theme.ts 保持一致（THEME_KEY / 两个主题色）。 -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem('qingmang_theme') === 'dark';
          var el = document.documentElement;
          el.setAttribute('data-theme', dark ? 'dark' : 'light');
          el.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#18181b' : '#fdfaf3';
        } catch (e) { /* 隐私模式等场景下 localStorage 不可用，保持默认亮色 */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Vite：入口模块（构建产物自动注入） -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
